<style>

// ---------- API LAYER (Google Apps Script fallback) ----------
async function apiGet(action, params={}){
  const qs = new URLSearchParams({ action, ...params }).toString();
  const res = await fetch(`${API_URL}?${qs}`);
  return res.json();
}
async function apiPost(action, payload={}){
  const res = await fetch(API_URL, {
    method: 'POST',
    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
    body: JSON.stringify({ action, ...payload })
  });
  return res.json();
}

// ---------- UNIFIED DB MUTATIONS ----------
async function dbAddTeam(p) {
  if (supabaseClient) {
    const id = 't_' + Date.now() + '_' + Math.floor(Math.random() * 1000);
    const { error } = await supabaseClient.from('teams').insert([{
      id, name: p.name,
      past: Number(p.past)||0, present: Number(p.present)||0, future: Number(p.future)||0
    }]);
    if (error) throw new Error(error.message);
    return { ok: true, id };
  } else {
    return apiPost('addTeam', p);
  }
}

async function dbAddTeamsBulk(rows) {
  if (supabaseClient) {
    const records = rows.map(r => ({
      id: 't_' + Date.now() + '_' + Math.floor(Math.random() * 10000) + '_' + Math.floor(Math.random()*100),
      name: r.name,
      past: Number(r.past)||0, present: Number(r.present)||0, future: Number(r.future)||0
    }));
    const { error } = await supabaseClient.from('teams').insert(records);
    if (error) throw new Error(error.message);
    return { ok: true, count: records.length };
  } else {
    let done = 0;
    for (const row of rows) {
      await apiPost('addTeam', row);
      done++;
    }
    return { ok: true, count: done };
  }
}

async function dbDeleteTeam(id) {
  if (supabaseClient) {
    const { error } = await supabaseClient.from('teams').delete().eq('id', id);
    if (error) throw new Error(error.message);
    return { ok: true };
  } else {
    return apiPost('deleteTeam', { id });

}

async function dbAppendMatch(p) {

      wager: Number(p.wager), coin_type: p.coinType,
      result_a: p.resultA, result_b: p.resultB,
      change_a: Number(p.changeA), change_b: Number(p.changeB),

    }]);
    if (error) throw new Error(error.message);
    return { ok: true };

async function dbResetAll() {
  if (supabaseClient) {
    await Promise.all([
      supabaseClient.from('matches').delete().neq('id', -1),
      supabaseClient.from('teams').delete().neq('id', '__none__'),
      supabaseClient.from('stalls').delete().neq('id', '__none__')
    ]);
    return { ok: true };
  } else {
    return apiPost('resetAll', {});
  }
}

function enrichTeams(teams, matches){
  return teams.map(t=>{
    const own = matches.filter(m=> m.teamAId===t.id || m.teamBId===t.id);
    const playedStalls = [...new Set(own.map(m=>m.stallId))];
    const opponentCounts = {};
    const opponentMatchDetails = {};
    const matchLog = own.map(m=>{
      const isA = m.teamAId===t.id;
      const oppId = isA ? m.teamBId : m.teamAId;
      const oppName = isA ? m.teamBName : m.teamAName;
      opponentCounts[oppId] = (opponentCounts[oppId]||0)+1;
      if(!opponentMatchDetails[oppId]) opponentMatchDetails[oppId] = [];
      opponentMatchDetails[oppId].push({
        stallName: m.stallName,
        time: m.time,
        result: isA ? m.resultA : m.resultB
      });
      return {
        time: m.time, stallId: m.stallId, stallName: m.stallName,
        opponentId: oppId, opponentName: oppName,
        wager: Number(m.wager), coinType: m.coinType,
        result: isA ? m.resultA : m.resultB,
        coinChange: Number(isA ? m.changeA : m.changeB),
        conductor: m.conductor
      };
    });
    return {
      id: t.id, name: t.name,
      coins: { past: Number(t.past), present: Number(t.present), future: Number(t.future) },
      playedStalls, opponentCounts, opponentMatchDetails, matchLog
    };
  });
}

async function loadAll(){
  try{
    if (supabaseClient) {
      const [tRes, sRes, mRes] = await Promise.all([
        supabaseClient.from('teams').select('*'),
        supabaseClient.from('stalls').select('*'),
        supabaseClient.from('matches').select('*').order('time', { ascending: true })
      ]);
      if (tRes.error) throw new Error(tRes.error.message);
      if (sRes.error) throw new Error(sRes.error.message);
      if (mRes.error) throw new Error(mRes.error.message);

      const rawStalls = (sRes.data || []).map(s => ({
        id: s.id, name: s.name, category: s.category, minWager: Number(s.min_wager !== undefined ? s.min_wager : (s.minWager || 1))
      }));

      const rawMatches = (mRes.data || []).map(m => ({
        time: Number(m.time),
        stallId: m.stall_id || m.stallId, stallName: m.stall_name || m.stallName,
        teamAId: m.team_a_id || m.teamAId, teamAName: m.team_a_name || m.teamAName,
        teamBId: m.team_b_id || m.teamBId, teamBName: m.team_b_name || m.teamBName,
        wager: Number(m.wager), coinType: m.coin_type || m.coinType,
        resultA: m.result_a || m.resultA, resultB: m.result_b || m.resultB,
        changeA: Number(m.change_a || m.changeA), changeB: Number(m.change_b || m.changeB),
        conductor: m.conductor || ''
      }));

      const rawTeams = (tRes.data || []).map(t => ({
        id: t.id, name: t.name, past: Number(t.past), present: Number(t.present), future: Number(t.future)
      }));

      const teams = enrichTeams(rawTeams, rawMatches);
      return { teams, stalls: rawStalls, matches: rawMatches };
    } else {
      const data = await apiGet('getAll');
      if(data.error) throw new Error(data.error);
      const stalls = (data.stalls||[]).map(s=>({ ...s, minWager: Number(s.minWager) }));
      const matches = (data.matches||[]).map(m=>({
        ...m, time: Number(m.time), wager: Number(m.wager),
        changeA: Number(m.changeA), changeB: Number(m.changeB)
      }));
      const teams = enrichTeams(data.teams||[], matches);
      return { teams, stalls, matches };
    }
  } catch(e){
    console.error(e);
    return { teams: [], stalls: [], matches: [], error: e.message };
  }
}

let isRealtimeInitialized = false;
function initRealtimeSync() {
  if (!supabaseClient || isRealtimeInitialized) return;
  try {
    supabaseClient
      .channel('public-db-changes')
      .on('postgres_changes', { event: '*', schema: 'public' }, () => {
        if (document.visibilityState === 'visible') {
          renderMain(true);
        }
      })
      .subscribe();
    isRealtimeInitialized = true;
  } catch(e) {
    console.warn('Realtime error:', e);
  }
}

function coinValue(team){
  return team.coins.past/RATIO.pastPerFuture + team.coins.present/RATIO.presentPerFuture + team.coins.future;
}
function wins(team){ return team.matchLog.filter(m=>m.result==='Win').length; }

// ---------- H2H DISCREPANCY HELPERS ----------
function buildH2HHtml(teamA, teamB){
  const count = (teamA.opponentCounts[teamB.id] || 0);
  const details = (teamA.opponentMatchDetails[teamB.id] || []);
  const blocked = count >= MAX_ENCOUNTERS;
  const almostBlocked = count === MAX_ENCOUNTERS - 1;

  const pct = Math.min(100, Math.round((count / MAX_ENCOUNTERS) * 100));
  const fillColor = blocked ? 'var(--loss)' : almostBlocked ? 'var(--past)' : 'var(--win)';
  const countClass = blocked ? 'err-count' : almostBlocked ? 'warn-count' : 'ok-count';

  let html = `
    <div class="h2h-bar">
      <span class="h2h-count ${countClass}">${count}</span>
      <div style="flex:1;">
        <div class="progress-track">
          <div class="progress-fill" style="width:${pct}%;background:${fillColor};"></div>
        </div>
        <div class="h2h-label">${count} of ${MAX_ENCOUNTERS} allowed encounters used</div>
      </div>
    </div>`;

  if(details.length){
    html += `<table style="margin-top:6px;">
      <thead><tr><th>#</th><th>Stall / Game</th><th>Result for ${teamA.name}</th><th>Time</th></tr></thead>
      <tbody>
      ${details.map((d,i)=>`
        <tr>
          <td>${i+1}</td>
          <td>${d.stallName}</td>
          <td><span class="pill ${d.result.includes('Win')?'win':d.result.includes('Loss')?'loss':'tie'}">${d.result}</span></td>
          <td>${new Date(d.time).toLocaleTimeString()}</td>
        </tr>`).join('')}
      </tbody></table>`;
  }

  if(blocked){
    html += `<div class="msg err" style="margin-top:10px;">⚠ These two teams have already competed <strong>${MAX_ENCOUNTERS} times</strong> — they <strong>cannot compete further</strong>.</div>`;
  } else if(almostBlocked){
    html += `<div class="msg warn" style="margin-top:10px;">⚠ One encounter left — this will be their final allowed match.</div>`;
  }

  return html;
}

        Open <code>index.html</code>, paste your <code>SUPABASE_URL</code> and <code>SUPABASE_ANON_KEY</code> at the top of the script.</p>
        <p><strong>Option 2: Google Apps Script (Fallback)</strong><br>
        Paste your Apps Script Web App URL into <code>API_URL</code> at the top of the script.</p>

  if(activeTab==='conductor')   return renderConductor(main);

  if(activeTab==='team')        return renderTeamView(main);

      const val = document.getElementById('adminPw').value;
      if(val === ADMIN_PASSWORD){ isAdminUnlocked = true; renderSetup(main); }
      else document.getElementById('adminMsg').innerHTML = '<div class="msg err">Incorrect password.</div>';
    };
    document.getElementById('adminPw').onkeydown = (e)=>{ if(e.key==='Enter') document.getElementById('adminUnlockBtn').click(); };
    return;
  }

  const { teams, stalls, matches, error } = await loadAll();
  if(error){
    main.innerHTML = `<div class="card"><div class="msg err">Couldn't reach the Google Sheet: ${error}. Check the API_URL and that the Apps Script is deployed with "Anyone" access.</div></div>`;
    return;
  }

  main.innerHTML = `
    <!-- ========= DATABASE STATUS CARD ========= -->
    <div class="card">
      <h2>Database Connection</h2>
      <div class="sub">Current backend: <strong>${getBackendMode()}</strong></div>
      ${supabaseClient ? `
        <div class="msg ok">⚡ Connected to Supabase PostgreSQL database. High performance (<50ms response), ready for 30+ concurrent users with real-time sync across devices.</div>
      ` : `
        <div class="msg warn">⚠ Currently using Google Apps Script / Google Sheets.<br>
        <strong>Handling 30 users at a time?</strong> Upgrade to Supabase (100% Free)! Google Sheets locking will slow down or error when 30 stall conductors submit matches simultaneously.<br>
        Run <code>supabase-schema.sql</code> in your Supabase SQL editor and add your credentials to <code>index.html</code>.</div>
      `}
    </div>

    <!-- ========= ADD TEAM ========= -->
    <div class="card">
      <h2>Add a Team</h2>
      <div class="sub">Starting coins default to ${DEFAULT_START.past} Past / ${DEFAULT_START.present} Present / ${DEFAULT_START.future} Future per the rules — adjust if needed.</div>

      <!-- Manual entry -->
      <div class="row"><div><label>Team name</label><input id="teamName" placeholder="e.g. Team Falcon"></div></div>
      <div class="row">
        <div><label>Past</label><input id="startPast" type="number" value="${DEFAULT_START.past}" min="0"></div>
        <div><label>Present</label><input id="startPresent" type="number" value="${DEFAULT_START.present}" min="0"></div>
        <div><label>Future</label><input id="startFuture" type="number" value="${DEFAULT_START.future}" min="0"></div>
      </div>
      <button class="btn" id="addTeamBtn">Add Team</button>
      <div id="setupMsg"></div>

      <hr class="divider">

      <!-- Excel import -->
      <h2 style="font-size:0.95rem; margin-bottom:4px;">📥 Import Participants from Excel</h2>
      <div class="sub">
        Upload an <code>.xlsx</code> / <code>.xls</code> file. The app reads these columns from the first sheet:
        <strong>«${IMPORT_FIELDS.name}»</strong> (required),
        <strong>«${IMPORT_FIELDS.past}»</strong>,
        <strong>«${IMPORT_FIELDS.present}»</strong>,
        <strong>«${IMPORT_FIELDS.future}»</strong> (optional, defaults to ${DEFAULT_START.past}/${DEFAULT_START.present}/${DEFAULT_START.future}).
        Column names are set by <code>IMPORT_FIELDS</code> in the script and can be changed by a developer.
      </div>
      <label>Excel file</label>
      <input type="file" id="importFile" accept=".xlsx,.xls,.csv">
      <div style="display:flex;gap:10px;flex-wrap:wrap;">
        <button class="btn secondary" id="previewImportBtn" style="margin-top:10px;">Preview</button>
        <button class="btn" id="importAllBtn" style="margin-top:10px;" disabled>Import All</button>
      </div>
      <div id="importPreviewArea"></div>
      <div id="importMsg"></div>

      <hr class="divider">

      <table><thead><tr><th>Team</th><th>Coins (P/Pr/F)</th><th></th></tr></thead>
      <tbody>
      ${teams.length? teams.map(t=>`
        <tr><td>${t.name}</td><td>${t.coins.past} / ${t.coins.present} / ${t.coins.future}</td>
        <td><button class="btn danger small" data-del-team="${t.id}">Remove</button></td></tr>
      `).join('') : '<tr><td colspan="3" class="empty">No teams yet.</td></tr>'}
      </tbody></table>
    </div>

    <!-- ========= ADD STALL ========= -->
    <div class="card">
      <h2>Add a Stall</h2>
      <div class="sub">21 stalls total, split across Past / Present / Future categories.</div>
      <div class="row">
        <div><label>Stall name</label><input id="stallName" placeholder="e.g. Time Capsule Trivia"></div>
        <div><label>Category</label><select id="stallCat"><option>Past</option><option>Present</option><option>Future</option></select></div>
        <div><label>Minimum wager</label><input id="stallWager" type="number" min="1" value="1"></div>
      </div>
      <button class="btn" id="addStallBtn">Add Stall</button>
      <table><thead><tr><th>Stall</th><th>Category</th><th>Min wager</th><th></th></tr></thead>
      <tbody>
      ${stalls.length? stalls.map(s=>`
        <tr><td>${s.name}</td><td>${s.category}</td><td>${s.minWager}</td>
        <td><button class="btn danger small" data-del-stall="${s.id}">Remove</button></td></tr>
      `).join('') : '<tr><td colspan="4" class="empty">No stalls yet.</td></tr>'}
      </tbody></table>
    </div>

    <!-- ========= EXPORT ========= -->
    <div class="card">
      <h2>Backup / Export</h2>
      <div class="sub">Every action writes straight to your connected database — that's your live backup. This button gives you a point-in-time <code>.xlsx</code> snapshot with all participants, stalls, matches, and leaderboard.</div>
      <button class="btn secondary" id="exportBtn">⬇ Download Excel Backup</button>
      <div id="exportMsg"></div>
    </div>

    <!-- ========= FULL MATCH LOG ========= -->
    <div class="card">
      <h2>Full Match Log</h2>
      <div class="sub">Every recorded result — for audit purposes.</div>
      <table><thead><tr><th>Time</th><th>Team</th><th>Opponent</th><th>Stall</th><th>Result</th><th>Coins ±</th><th>Conductor</th></tr></thead>
      <tbody id="fullLog"></tbody></table>
    </div>

    <!-- ========= DANGER ZONE ========= -->
    <div class="card">
      <h2>Danger Zone</h2>
      <button class="btn danger" id="resetBtn">Reset All Data</button>
    </div>
  `;

  // ---- Full log ----
  const allLog = [];
  teams.forEach(t=> t.matchLog.forEach(m=> allLog.push({...m, team:t.name})));
  allLog.sort((a,b)=> b.time - a.time);
  document.getElementById('fullLog').innerHTML = allLog.length ? allLog.map(m=>`
    <tr><td>${new Date(m.time).toLocaleTimeString()}</td><td>${m.team}</td><td>${m.opponentName}</td>
    <td>${m.stallName}</td><td><span class="pill ${m.result.includes('Win')?'win':m.result.includes('Loss')?'loss':'tie'}">${m.result}</span></td>
    <td>${m.coinChange>0?'+':''}${m.coinChange} ${m.coinType}</td><td>${m.conductor||'—'}</td></tr>
  `).join('') : '<tr><td colspan="7" class="empty">No matches recorded yet.</td></tr>';

  // ---- Add Team (manual) ----
  document.getElementById('addTeamBtn').onclick = async ()=>{
    const name = document.getElementById('teamName').value.trim();
    const msg = document.getElementById('setupMsg');
    if(!name){ msg.innerHTML = '<div class="msg err">Enter a team name.</div>'; return; }
    const fresh = await loadAll();
    if(fresh.teams.some(t=>t.name.toLowerCase()===name.toLowerCase())){ msg.innerHTML = '<div class="msg err">A team with that name already exists.</div>'; return; }
    try {
      await dbAddTeam({
        name,
        past: Number(document.getElementById('startPast').value)||0,
        present: Number(document.getElementById('startPresent').value)||0,
        future: Number(document.getElementById('startFuture').value)||0
      });
      renderSetup(main);
    } catch(e) {
      msg.innerHTML = `<div class="msg err">Failed to add team: ${e.message}</div>`;
    }
  };

  // ---- Import: Preview ----
  let importRows = []; // rows ready to import

  document.getElementById('previewImportBtn').onclick = ()=>{
    const file = document.getElementById('importFile').files[0];
    const previewArea = document.getElementById('importPreviewArea');
    const importMsg = document.getElementById('importMsg');
    importMsg.innerHTML = '';
    if(!file){ importMsg.innerHTML = '<div class="msg err">Choose a file first.</div>'; return; }

    const reader = new FileReader();
    reader.onload = (e)=>{
      try{
        const wb = XLSX.read(e.target.result, { type: 'array' });
        const ws = wb.Sheets[wb.SheetNames[0]];
        const raw = XLSX.utils.sheet_to_json(ws, { defval: '' });

        importRows = [];
        const existingNames = new Set(teams.map(t=>t.name.toLowerCase()));

        const parsed = raw.map(row=>{
          const name = String(row[IMPORT_FIELDS.name]||'').trim();
          const past    = Number(row[IMPORT_FIELDS.past])    || DEFAULT_START.past;
          const present = Number(row[IMPORT_FIELDS.present]) || DEFAULT_START.present;
          const future  = Number(row[IMPORT_FIELDS.future])  || DEFAULT_START.future;
          const skip = !name || existingNames.has(name.toLowerCase());
          if(!skip) importRows.push({ name, past, present, future });
          return { name: name||'(blank)', past, present, future, skip };
        });

        if(!parsed.length){
          previewArea.innerHTML = '<div class="msg warn">No rows found in the file.</div>';
          document.getElementById('importAllBtn').disabled = true;
          return;
        }

        previewArea.innerHTML = `
          <div class="import-preview">
            <table>
              <thead><tr><th>Name</th><th>Past</th><th>Present</th><th>Future</th><th>Status</th></tr></thead>
              <tbody>
              ${parsed.map(r=>`
                <tr class="${r.skip?'import-row-skip':'import-row-ok'}">
                  <td>${r.name}</td><td>${r.past}</td><td>${r.present}</td><td>${r.future}</td>
                  <td>${r.skip ? '<span class="muted">Skip (exists / blank)</span>' : '<span style="color:var(--win)">✓ Import</span>'}</td>
                </tr>`).join('')}
              </tbody>
            </table>
          </div>
          <div class="muted" style="font-size:0.8rem; margin-top:6px;">${importRows.length} row(s) will be imported · ${parsed.length - importRows.length} skipped</div>`;

        document.getElementById('importAllBtn').disabled = importRows.length === 0;
      } catch(err){
        previewArea.innerHTML = `<div class="msg err">Could not read file: ${err.message}</div>`;
        document.getElementById('importAllBtn').disabled = true;
      }
    };
    reader.readAsArrayBuffer(file);
  };

  // ---- Import: Bulk add ----
  document.getElementById('importAllBtn').onclick = async ()=>{
    const btn = document.getElementById('importAllBtn');
    const importMsg = document.getElementById('importMsg');
    if(!importRows.length){ importMsg.innerHTML = '<div class="msg err">Nothing to import.</div>'; return; }
    btn.disabled = true;
    btn.textContent = 'Importing…';
    try {
      const res = await dbAddTeamsBulk(importRows);
      importMsg.innerHTML = `<div class="msg ok">Imported ${res.count} team(s) successfully!</div>`;
      importRows = [];
      renderSetup(main);
    } catch(e) {
      importMsg.innerHTML = `<div class="msg err">Import failed: ${e.message}</div>`;
      btn.disabled = false;
      btn.textContent = 'Import All';
    }
  };

  // ---- Add Stall ----
  document.getElementById('addStallBtn').onclick = async ()=>{
    const name = document.getElementById('stallName').value.trim();
    const cat  = document.getElementById('stallCat').value;
    const wager = Number(document.getElementById('stallWager').value);
    if(!name || !wager || wager<1) return;
    try {
      await dbAddStall({ name, category: cat, minWager: wager });
      renderSetup(main);
    } catch(e) {
      alert(`Could not add stall: ${e.message}`);
    }
  };

  main.querySelectorAll('[data-del-team]').forEach(b=>{
    b.onclick = async ()=>{
      if(!confirm('Remove this team? This deletes their coin record.')) return;
      try {
        await dbDeleteTeam(b.dataset.delTeam);
        renderSetup(main);
      } catch(e) {
        alert(`Could not delete team: ${e.message}`);
      }
    };
  });
  main.querySelectorAll('[data-del-stall]').forEach(b=>{
    b.onclick = async ()=>{
      if(!confirm('Remove this stall?')) return;
      try {
        await dbDeleteStall(b.dataset.delStall);
        renderSetup(main);
      } catch(e) {
        alert(`Could not delete stall: ${e.message}`);
      }
    };
  });

  // ---- Export ----
  document.getElementById('exportBtn').onclick = async ()=>{
    const msg = document.getElementById('exportMsg');
    msg.innerHTML = '<div class="msg ok">Building file…</div>';
    try{
      const { teams: t2, stalls: s2, matches: m2 } = await loadAll();
      const wb = XLSX.utils.book_new();

      const participantRows = t2.map(t=>({
        [IMPORT_FIELDS.name]:    t.name,
        [IMPORT_FIELDS.past]:    t.coins.past,
        [IMPORT_FIELDS.present]: t.coins.present,
        [IMPORT_FIELDS.future]:  t.coins.future,
        'Coin Value (Future-eq)': Number(coinValue(t).toFixed(2)),
        Wins: wins(t),
        'Stalls Played': t.playedStalls.length
      }));
      XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(participantRows), 'Participants');

      const teamRows = t2.map(t=>({
        ID: t.id, Name: t.name, Past: t.coins.past, Present: t.coins.present, Future: t.coins.future,
        'Coin Value (Future-eq)': Number(coinValue(t).toFixed(2)),
        Wins: wins(t), 'Stalls Played': t.playedStalls.length
      }));
      XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(teamRows), 'Teams');

      const stallRows = s2.map(s=>({ ID: s.id, Name: s.name, Category: s.category, 'Min Wager': s.minWager }));
      XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(stallRows), 'Stalls');

      const matchRows = m2.map(m=>({
        Time: new Date(m.time).toLocaleString(), Stall: m.stallName,
        'Team A': m.teamAName, 'Team B': m.teamBName, Wager: m.wager, 'Coin Type': m.coinType,
        'Result A': m.resultA, 'Result B': m.resultB, 'Change A': m.changeA, 'Change B': m.changeB, Conductor: m.conductor
      }));
      XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(matchRows), 'Match Log');

      const ranked = [...t2].sort((a,b)=> coinValue(b)-coinValue(a) || wins(b)-wins(a) || b.playedStalls.length-a.playedStalls.length);
      const lbRows = ranked.map((t,i)=>({
        Rank: i+1, Team: t.name, 'Coin Value': Number(coinValue(t).toFixed(2)),
        Wins: wins(t), Stalls: t.playedStalls.length, Qualified: i<15 ? 'Yes' : 'No'
      }));
      XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(lbRows), 'Leaderboard');

      XLSX.writeFile(wb, `round1-backup-${new Date().toISOString().slice(0,10)}.xlsx`);
      msg.innerHTML = '<div class="msg ok">Downloaded.</div>';
    } catch(e){
      msg.innerHTML = `<div class="msg err">Export failed: ${e.message}</div>`;
    }
  };

  document.getElementById('resetBtn').onclick = async ()=>{
    if(!confirm('This wipes ALL teams, stalls and match history from the database. Are you sure?')) return;
    if(!confirm('Really sure? This cannot be undone.')) return;
    try {
      await dbResetAll();
      renderSetup(main);
    } catch(e) {
      alert(`Reset failed: ${e.message}`);
    }
  };
}

// ============================================================
//  CONDUCTOR
// ============================================================
async function renderConductor(main){
  const { teams, stalls, error } = await loadAll();
  if(error){ main.innerHTML = `<div class="card"><div class="msg err">Couldn't reach the Google Sheet: ${error}</div></div>`; return; }

  main.innerHTML = `
    <!-- ========= RECORD MATCH ========= -->
    <div class="card">
      <h2>Record a Match</h2>
      <div class="sub">Pick the stall, then the two teams. Each team can only play a given stall once, and may face the same opponent at most <strong>${MAX_ENCOUNTERS} times</strong> total.</div>
      <label>Stall</label>
      <select id="stallSel"><option value="">— Select stall —</option>
        ${stalls.map(s=>`<option value="${s.id}">${s.name} (${s.category}, min ${s.minWager})</option>`).join('')}
      </select>
      <div class="row">
        <div><label>Team A</label><select id="teamASel"><option value="">— Select —</option>${teams.map(t=>`<option value="${t.id}">${t.name}</option>`).join('')}</select></div>
        <div><label>Team B</label><select id="teamBSel"><option value="">— Select —</option>${teams.map(t=>`<option value="${t.id}">${t.name}</option>`).join('')}</select></div>
      </div>
      <label>Conductor initials</label>
      <input id="conductorInit" placeholder="e.g. RS">
      <div id="wagerInfo"></div>
      <div id="h2hInfo"></div>
      <div class="row" style="margin-top:14px;">
        <button class="btn" data-outcome="A" id="outcomeA">Team A Wins</button>
        <button class="btn" data-outcome="B" id="outcomeB">Team B Wins</button>
        <button class="btn secondary" data-outcome="winTie" id="outcomeWT">Winning Tie</button>
        <button class="btn danger" data-outcome="loseTie" id="outcomeLT">Losing Tie</button>
      </div>
      <div id="conductorMsg"></div>
    </div>

    <!-- ========= DISCREPANCY CHECKER ========= -->
    <div class="card">
      <h2>🔍 Head-to-Head Discrepancy Check</h2>
      <div class="sub">Check how many times any two teams have competed, and which stalls/games they played. A warning is shown when teams reach the ${MAX_ENCOUNTERS}-encounter limit.</div>
      <div class="row">
        <div><label>Team A</label><select id="dcA"><option value="">— Select —</option>${teams.map(t=>`<option value="${t.id}">${t.name}</option>`).join('')}</select></div>
        <div><label>Team B</label><select id="dcB"><option value="">— Select —</option>${teams.map(t=>`<option value="${t.id}">${t.name}</option>`).join('')}</select></div>
      </div>
      <div id="dcResult"></div>
    </div>
  `;

  const outcomeButtons = ['outcomeA','outcomeB','outcomeWT','outcomeLT'].map(id=>document.getElementById(id));

  function getTeamA(){ return teams.find(t=>t.id===document.getElementById('teamASel').value); }
  function getTeamB(){ return teams.find(t=>t.id===document.getElementById('teamBSel').value); }
  function currentStall(){ return stalls.find(s=>s.id===document.getElementById('stallSel').value); }

  function updateWagerInfo(){
    const stall = currentStall();
    const box = document.getElementById('wagerInfo');
    const a = getTeamA();
    const b = getTeamB();
    if(!stall){ box.innerHTML=''; return; }
    const type = stall.category.toLowerCase();
    let html = `<div class="msg warn" style="background:transparent;border:1px dashed var(--line);color:var(--muted);">
      Wager required: <b style="color:var(--text)">${stall.minWager} ${stall.category} coins</b> each.`;
    if(a) html += `<br>${a.name} has ${a.coins[type]} ${type}.`;
    if(b) html += `<br>${b.name} has ${b.coins[type]} ${type}.`;
    html += `</div>`;
    box.innerHTML = html;
  }

  function updateH2HInfo(){
    const a = getTeamA();
    const b = getTeamB();
    const box = document.getElementById('h2hInfo');
    if(!a || !b || a.id===b.id){ box.innerHTML=''; enableOutcomeButtons(); return; }

    const count = (a.opponentCounts[b.id] || 0);
    box.innerHTML = `
      <div style="margin-top:14px; padding:14px; border-radius:10px; border:1px solid var(--line); background:#0f1018;">
        <div style="font-size:0.78rem; color:var(--muted); font-weight:700; text-transform:uppercase; letter-spacing:.5px; margin-bottom:8px;">Head-to-Head History</div>
        ${buildH2HHtml(a, b)}
      </div>`;

    if(count >= MAX_ENCOUNTERS){
      disableOutcomeButtons();
    } else {
      enableOutcomeButtons();
    }
  }

  function enableOutcomeButtons(){ outcomeButtons.forEach(b=>b.disabled=false); }
  function disableOutcomeButtons(){ outcomeButtons.forEach(b=>b.disabled=true); }

  document.getElementById('stallSel').onchange = updateWagerInfo;
  document.getElementById('teamASel').onchange = ()=>{ updateWagerInfo(); updateH2HInfo(); };
  document.getElementById('teamBSel').onchange = ()=>{ updateWagerInfo(); updateH2HInfo(); };

  // ---- Standalone discrepancy checker ----
  function updateDcResult(){
    const dcA = document.getElementById('dcA').value;
    const dcB = document.getElementById('dcB').value;
    const res = document.getElementById('dcResult');
    if(!dcA || !dcB){ res.innerHTML=''; return; }
    if(dcA===dcB){ res.innerHTML='<div class="msg warn" style="margin-top:10px;">Select two different teams.</div>'; return; }
    const teamA = teams.find(t=>t.id===dcA);
    const teamB = teams.find(t=>t.id===dcB);
    if(!teamA || !teamB){ res.innerHTML=''; return; }
    res.innerHTML = `<div style="margin-top:14px;">${buildH2HHtml(teamA, teamB)}</div>`;
  }
  document.getElementById('dcA').onchange = updateDcResult;
  document.getElementById('dcB').onchange = updateDcResult;

  // ---- Outcome buttons ----
  main.querySelectorAll('[data-outcome]').forEach(btn=>{
    btn.onclick = async ()=>{
      const msg = document.getElementById('conductorMsg');
      const stallId = document.getElementById('stallSel').value;
      const aId = document.getElementById('teamASel').value;
      const bId = document.getElementById('teamBSel').value;
      const conductor = document.getElementById('conductorInit').value.trim();
      if(!stallId || !aId || !bId){ msg.innerHTML = '<div class="msg err">Select a stall and both teams.</div>'; return; }
      if(aId===bId){ msg.innerHTML = '<div class="msg err">Team A and Team B must be different.</div>'; return; }

      btn.disabled = true;
      const fresh = await loadAll();
      const stall = fresh.stalls.find(s=>s.id===stallId);
      const teamA = fresh.teams.find(t=>t.id===aId);
      const teamB = fresh.teams.find(t=>t.id===bId);
      if(!stall || !teamA || !teamB){ msg.innerHTML = '<div class="msg err">Data out of sync — refresh and try again.</div>'; btn.disabled=false; return; }

      if(teamA.playedStalls.includes(stallId) || teamB.playedStalls.includes(stallId)){
        msg.innerHTML = '<div class="msg err">One of these teams has already played this stall.</div>'; btn.disabled=false; return;
      }
      // Discrepancy check: enforce MAX_ENCOUNTERS cap
      const encounterCount = teamA.opponentCounts[bId] || 0;
      if(encounterCount >= MAX_ENCOUNTERS){
        msg.innerHTML = `<div class="msg err">⚠ These two teams have already competed <strong>${MAX_ENCOUNTERS} times</strong> — they <strong>cannot compete further</strong>.</div>`;
        btn.disabled=false; return;
      }
      const type = stall.category.toLowerCase();
      const wager = stall.minWager;
      if(teamA.coins[type] < wager || teamB.coins[type] < wager){
        msg.innerHTML = `<div class="msg err">One team lacks enough ${stall.category} coins (${wager} needed). Visit the Exchange Centre first.</div>`; btn.disabled=false; return;
      }

      const newA = { ...teamA.coins }, newB = { ...teamB.coins };
      newA[type] -= wager; newB[type] -= wager;
      let resultA, resultB, changeA, changeB;
      const outcome = btn.dataset.outcome;
      if(outcome==='A'){ newA[type]+=wager*2; resultA='Win'; resultB='Loss'; changeA=wager; changeB=-wager; }
      else if(outcome==='B'){ newB[type]+=wager*2; resultA='Loss'; resultB='Win'; changeA=-wager; changeB=wager; }
      else if(outcome==='winTie'){ newA[type]+=wager; newB[type]+=wager; resultA='Winning Tie'; resultB='Winning Tie'; changeA=0; changeB=0; }
      else { resultA='Losing Tie'; resultB='Losing Tie'; changeA=-wager; changeB=-wager; }

      try{
        if (supabaseClient) {
          await Promise.all([
            dbUpdateTeamCoins({ id: teamA.id, ...newA }),
            dbUpdateTeamCoins({ id: teamB.id, ...newB }),
            dbAppendMatch({
              time: Date.now(), stallId: stall.id, stallName: stall.name,
              teamAId: teamA.id, teamAName: teamA.name, teamBId: teamB.id, teamBName: teamB.name,
              wager, coinType: stall.category, resultA, resultB, changeA, changeB, conductor
            })
          ]);
        } else {
          await apiPost('updateTeamCoins', { id: teamA.id, ...newA });
          await apiPost('updateTeamCoins', { id: teamB.id, ...newB });
          await apiPost('appendMatch', {
            time: Date.now(), stallId: stall.id, stallName: stall.name,
            teamAId: teamA.id, teamAName: teamA.name, teamBId: teamB.id, teamBName: teamB.name,
            wager, coinType: stall.category, resultA, resultB, changeA, changeB, conductor
          });
        }
        msg.innerHTML = `<div class="msg ok">Recorded: ${teamA.name} (${resultA}) vs ${teamB.name} (${resultB}) at ${stall.name}.</div>`;
        renderConductor(main);
      } catch(e){
        msg.innerHTML = `<div class="msg err">Couldn't save match: ${e.message}. Nothing was recorded — try again.</div>`;
        btn.disabled = false;
      }
    };
  });
}

// ============================================================
//  EXCHANGE
// ============================================================
async function renderExchange(main){
  const { teams, error } = await loadAll();
  if(error){ main.innerHTML = `<div class="card"><div class="msg err">Couldn't reach the database: ${error}</div></div>`; return; }

  main.innerHTML = `
    <div class="card">
      <h2>Exchange Centre</h2>
      <div class="sub">Fixed ratio: 3 Past = 2 Present = 1 Future. Exchanges must convert to a whole number of coins.</div>
      <label>Team</label>
      <select id="exTeam"><option value="">— Select team —</option>${teams.map(t=>`<option value="${t.id}">${t.name}</option>`).join('')}</select>
      <div id="exBalance"></div>
      <div class="row">
        <div><label>From</label><select id="exFrom"><option value="past">Past</option><option value="present">Present</option><option value="future">Future</option></select></div>
        <div><label>To</label><select id="exTo"><option value="future">Future</option><option value="past">Past</option><option value="present">Present</option></select></div>
        <div><label>Amount (from)</label><input id="exAmt" type="number" min="1" value="1"></div>
      </div>
      <div id="exPreview" class="msg" style="background:transparent;border:1px dashed var(--line);color:var(--muted);"></div>
      <button class="btn" id="exBtn">Exchange</button>
      <div id="exMsg"></div>
    </div>
  `;
  function refreshBalance(){
    const t = teams.find(x=>x.id===document.getElementById('exTeam').value);
    const box = document.getElementById('exBalance');
    if(!t){ box.innerHTML=''; return; }
    box.innerHTML = `<div class="coin-badges">
      <span class="badge past">Past: ${t.coins.past}</span>
      <span class="badge present">Present: ${t.coins.present}</span>
      <span class="badge future">Future: ${t.coins.future}</span>
    </div>`;
  }
  function refreshPreview(){
    const from = document.getElementById('exFrom').value;
    const to   = document.getElementById('exTo').value;
    const amt  = Number(document.getElementById('exAmt').value);
    const box  = document.getElementById('exPreview');
    if(from===to){ box.textContent = 'Choose two different coin types.'; return; }
    const out = amt * RATE[`${from}-${to}`];
    if(!Number.isFinite(out) || !Number.isInteger(out) || out<=0){
      box.textContent = `${amt} ${from} does not convert to a whole number of ${to} coins. Try a different amount.`;
    } else {
      box.textContent = `${amt} ${from} → ${out} ${to}`;
    }
  }
  document.getElementById('exTeam').onchange = refreshBalance;
  document.getElementById('exFrom').onchange = refreshPreview;
  document.getElementById('exTo').onchange = refreshPreview;
  document.getElementById('exAmt').oninput = refreshPreview;
  refreshPreview();

  document.getElementById('exBtn').onclick = async ()=>{
    const msg = document.getElementById('exMsg');
    const btn = document.getElementById('exBtn');
    const teamId = document.getElementById('exTeam').value;
    const from = document.getElementById('exFrom').value;
    const to   = document.getElementById('exTo').value;
    const amt  = Number(document.getElementById('exAmt').value);
    if(!teamId){ msg.innerHTML = '<div class="msg err">Select a team.</div>'; return; }
    if(from===to){ msg.innerHTML = '<div class="msg err">Choose two different coin types.</div>'; return; }
    const out = amt*RATE[`${from}-${to}`];
    if(!Number.isInteger(out) || out<=0){ msg.innerHTML = '<div class="msg err">That amount does not convert evenly. Adjust it.</div>'; return; }

    btn.disabled = true;
    const fresh = await loadAll();
    const team = fresh.teams.find(t=>t.id===teamId);
    if(!team){ msg.innerHTML = '<div class="msg err">Team not found — refresh and retry.</div>'; btn.disabled=false; return; }
    if(team.coins[from] < amt){ msg.innerHTML = `<div class="msg err">${team.name} only has ${team.coins[from]} ${from} coins.</div>`; btn.disabled=false; return; }

    const newCoins = { ...team.coins };
    newCoins[from] -= amt; newCoins[to] += out;
    try{
      await dbUpdateTeamCoins({ id: team.id, ...newCoins });
      msg.innerHTML = `<div class="msg ok">Exchanged ${amt} ${from} → ${out} ${to} for ${team.name}.</div>`;
      renderExchange(main);
    } catch(e){
      msg.innerHTML = `<div class="msg err">Couldn't save to the database: ${e.message}.</div>`;
      btn.disabled = false;
    }
  };
}

// ============================================================
//  TEAM VIEW
// ============================================================
async function renderTeamView(main){
  const { teams, stalls, error } = await loadAll();
  if(error){ main.innerHTML = `<div class="card"><div class="msg err">Couldn't reach the Google Sheet: ${error}</div></div>`; return; }

  main.innerHTML = `
    <div class="card">
      <h2>Team View</h2>
      <div class="sub">Select a team to see their coins, stalls played, and match history.</div>
      <select id="tvSel"><option value="">— Select team —</option>${teams.map(t=>`<option value="${t.id}">${t.name}</option>`).join('')}</select>
      <div id="tvBody"></div>
    </div>
  `;
  document.getElementById('tvSel').onchange = ()=>{
    const t = teams.find(x=>x.id===document.getElementById('tvSel').value);
    const body = document.getElementById('tvBody');
    if(!t){ body.innerHTML=''; return; }
    const remaining = stalls.filter(s=>!t.playedStalls.includes(s.id));
    const value = coinValue(t).toFixed(2);
    const canAffordAny = remaining.some(s=> t.coins[s.category.toLowerCase()] >= s.minWager || value >= s.minWager*(s.category==='Past'?1/3:s.category==='Present'?1/2:1));
    const eliminated = remaining.length>0 && !canAffordAny;

    // Build opponent encounter summary
    const opponentSummary = Object.entries(t.opponentCounts).map(([oppId, cnt])=>{
      const opp = teams.find(x=>x.id===oppId);
      const oppName = opp ? opp.name : oppId;
      const blocked = cnt >= MAX_ENCOUNTERS;
      return `<tr>
        <td>${oppName}</td>
        <td>${cnt} / ${MAX_ENCOUNTERS}</td>
        <td>${blocked ? '<span class="pill loss">Blocked</span>' : cnt === MAX_ENCOUNTERS-1 ? '<span class="pill tie">Last match</span>' : '<span class="pill win">OK</span>'}</td>
      </tr>`;
    }).join('');

    body.innerHTML = `
      <div class="coin-badges">
        <span class="badge past">Past: ${t.coins.past}</span>
        <span class="badge present">Present: ${t.coins.present}</span>
        <span class="badge future">Future: ${t.coins.future}</span>
        <span class="pill ${eliminated?'eliminated':'active'}">${eliminated?'Likely Eliminated':'Active'}</span>
      </div>
      <div class="muted" style="font-size:0.82rem;">Total coin value (Future-equivalent): <b style="color:var(--text)">${value}</b> · Wins: <b style="color:var(--text)">${wins(t)}</b> · Stalls played: <b style="color:var(--text)">${t.playedStalls.length}/${stalls.length}</b></div>

      <h2 style="margin-top:18px; font-size:0.95rem;">Match History</h2>
      <table><thead><tr><th>Stall</th><th>Opponent</th><th>Result</th><th>Coins ±</th></tr></thead>
      <tbody>${t.matchLog.length ? t.matchLog.map(m=>`
        <tr><td>${m.stallName}</td><td>${m.opponentName}</td>
        <td><span class="pill ${m.result.includes('Win')?'win':m.result.includes('Loss')?'loss':'tie'}">${m.result}</span></td>
        <td>${m.coinChange>0?'+':''}${m.coinChange} ${m.coinType}</td></tr>
      `).join('') : '<tr><td colspan="4" class="empty">No matches played yet.</td></tr>'}</tbody></table>

      ${Object.keys(t.opponentCounts).length ? `
      <h2 style="margin-top:18px; font-size:0.95rem;">Opponent Encounter Count</h2>
      <table><thead><tr><th>Opponent</th><th>Encounters</th><th>Status</th></tr></thead>
      <tbody>${opponentSummary}</tbody></table>` : ''}

      <h2 style="margin-top:18px; font-size:0.95rem;">Stalls Remaining</h2>
      ${remaining.length? remaining.map(s=>`<div class="row" style="margin:0; border-bottom:1px solid var(--line); padding:9px 4px;"><span>${s.name} <span class="tag">${s.category}</span></span></div>`).join('') : '<div class="empty">All stalls attempted.</div>'}
    `;
  };
}

// ============================================================
//  LEADERBOARD
// ============================================================
async function renderLeaderboard(main){
  const { teams, stalls, error } = await loadAll();
  if(error){ main.innerHTML = `<div class="card"><div class="msg err">Couldn't reach the Google Sheet: ${error}</div></div>`; return; }

  const ranked = teams.map(t=>({
    name: t.name, value: coinValue(t), wins: wins(t), stallsCompleted: t.playedStalls.length
  })).sort((a,b)=> b.value-a.value || b.wins-a.wins || b.stallsCompleted-a.stallsCompleted);

  main.innerHTML = `
    <div class="card">
      <h2>Leaderboard</h2>
      <div class="sub">Ranked by total coin value (Future-equivalent), then wins, then stalls completed. Top 15 qualify for Round 2.</div>
      <table><thead><tr><th>Rank</th><th>Team</th><th>Coin Value</th><th>Wins</th><th>Stalls</th></tr></thead>
      <tbody>
      ${ranked.length ? ranked.map((r,i)=>`
        <tr class="${i<15?'qualified':''}"><td>${i+1}${i<15?' ✓':''}</td><td>${r.name}</td>
        <td>${r.value.toFixed(2)}</td><td>${r.wins}</td><td>${r.stallsCompleted}/${stalls.length}</td></tr>
      `).join('') : '<tr><td colspan="5" class="empty">No teams yet.</td></tr>'}
      </tbody></table>
    </div>
  `;
}

renderMain();
